<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self'; worker-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#050505">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Noise">
<meta name="description" content="Brown, pink, white, blue, and violet noise for focus.">
<title>Noise</title>
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<link rel="stylesheet" href="/src/styles.css">
<script type="module" src="/src/main.js"></script>
</head>
<body>
<div class="layers" aria-hidden="true">
  <div class="layer" data-id="brown"></div>
  <div class="layer" data-id="pink"></div>
  <div class="layer" data-id="white"></div>
  <div class="layer" data-id="blue"></div>
  <div class="layer" data-id="violet"></div>
  <div class="layer idle" id="idle"></div>
</div>
<main id="surface">
  <canvas id="spec" aria-hidden="true"></canvas>
  <button class="sr" id="play" type="button" aria-label="Play"></button>
  <button class="hit" id="timer" type="button" aria-label="Timer off" aria-pressed="false"></button>
  <label class="sr" for="slope">Noise colour</label>
  <input class="sr" id="slope" type="range" min="0" max="4" step="0.25" value="0">
  <label class="sr" for="volume">Volume</label>
  <input class="sr" id="volume" type="range" min="0.1" max="1" step="0.05" value="0.6">
</main>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="insets" aria-hidden="true"></div>
</body>
</html>
